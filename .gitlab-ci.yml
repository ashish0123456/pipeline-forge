stages:
  - test
  - build

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

test:
  stage: test
  image: ruby:3.4.8
  services:
    - postgres:15
    - redis:7-alpine

  variables:
    RAILS_ENV: test
    POSTGRES_DB: ci_platform_test
    POSTGRES_USER: ci_platform
    POSTGRES_PASSWORD: password
    CI_PLATFORM_DATABASE_HOST: postgres
    CI_PLATFORM_DATABASE_USERNAME: ci_platform
    CI_PLATFORM_DATABASE_PASSWORD: password
    REDIS_URL: redis://redis:6379/0

  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - gem install bundler
    - bundle config set path 'vendor/ruby'
    - bundle install --jobs $(nproc) --retry 3
    - until pg_isready -h postgres -U ci_platform -d ci_platform_test; do sleep 1; done
    - bundle exec rails db:prepare

  script:
    - bundle exec rails test

  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - vendor/ruby

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

build_and_push:
  stage: build
  image: docker:27.4.1
  services:
    - name: docker:27.4.1-dind
      alias: docker

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin

  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
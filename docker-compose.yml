services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ci_platform_db
      POSTGRES_USER: ci_platform
      POSTGRES_PASSWORD: ${CI_PLATFORM_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_platform -d ci_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      CI_PLATFORM_DATABASE_HOST: db
      CI_PLATFORM_DATABASE_USERNAME: ci_platform
      CI_PLATFORM_DATABASE_PASSWORD: ${CI_PLATFORM_DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CI_SEED_ADMIN_EMAIL: ${CI_SEED_ADMIN_EMAIL:-admin@example.com}
      CI_SEED_ADMIN_PASSWORD: ${CI_SEED_ADMIN_PASSWORD:?Set CI_SEED_ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails db:seed && exec bundle exec rails s -p 3000 -b '0.0.0.0'"
    init: true

  worker:
    build: .
    environment:
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      CI_PLATFORM_DATABASE_HOST: db
      CI_PLATFORM_DATABASE_USERNAME: ci_platform
      CI_PLATFORM_DATABASE_PASSWORD: ${CI_PLATFORM_DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CI_EXECUTOR: docker
      CI_EXECUTOR_IMAGE: ${CI_EXECUTOR_IMAGE:-ruby:3.4.8-slim}
      CI_ARCHIVE_MAX_BYTES: ${CI_ARCHIVE_MAX_BYTES:-52428800}
      CI_ARCHIVE_MAX_EXTRACTED_BYTES: ${CI_ARCHIVE_MAX_EXTRACTED_BYTES:-209715200}
      CI_ARCHIVE_MAX_ENTRIES: ${CI_ARCHIVE_MAX_ENTRIES:-20000}
      CI_EXECUTOR_WORKSPACE_BYTES: ${CI_EXECUTOR_WORKSPACE_BYTES:-268435456}
      CI_EXECUTOR_TIMEOUT: ${CI_EXECUTOR_TIMEOUT:-300}
      CI_RUN_TIMEOUT: ${CI_RUN_TIMEOUT:-900}
      CI_EXECUTOR_MAX_OUTPUT_BYTES: ${CI_EXECUTOR_MAX_OUTPUT_BYTES:-200000}
      CI_EXECUTOR_MAX_LOG_BYTES_PER_JOB: ${CI_EXECUTOR_MAX_LOG_BYTES_PER_JOB:-1000000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: bundle exec sidekiq

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ci_platform_production
      POSTGRES_USER: ci_platform
      POSTGRES_PASSWORD: ${CI_PLATFORM_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_platform -d ci_platform_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    image: ${CI_REGISTRY_IMAGE:?Set CI_REGISTRY_IMAGE}:${IMAGE_TAG:-latest}
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      CI_PLATFORM_DATABASE_USERNAME: ci_platform
      CI_PLATFORM_DATABASE_PASSWORD: ${CI_PLATFORM_DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    init: true
    command: bash -c "bundle exec rails db:migrate && exec ./bin/thrust ./bin/rails server"

  worker:
    image: ${CI_REGISTRY_IMAGE:?Set CI_REGISTRY_IMAGE}:${IMAGE_TAG:-latest}
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      CI_PLATFORM_DATABASE_USERNAME: ci_platform
      CI_PLATFORM_DATABASE_PASSWORD: ${CI_PLATFORM_DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: bundle exec sidekiq

volumes:
  postgres_data:
  redis_data:
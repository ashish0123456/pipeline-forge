services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ci_platform_production
      POSTGRES_USER: ci_platform
      POSTGRES_PASSWORD: ${CI_PLATFORM_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_platform -d ci_platform_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    image: ${CI_REGISTRY_IMAGE:?Set CI_REGISTRY_IMAGE}:${IMAGE_TAG:-latest}
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      CI_PLATFORM_DATABASE_HOST: db
      CI_PLATFORM_DATABASE_USERNAME: ci_platform
      CI_PLATFORM_DATABASE_PASSWORD: ${CI_PLATFORM_DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    init: true
    command: bash -c "bundle exec rails db:migrate && exec ./bin/thrust ./bin/rails server"

  worker:
    image: ${CI_REGISTRY_IMAGE:?Set CI_REGISTRY_IMAGE}:${IMAGE_TAG:-latest}
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      CI_PLATFORM_DATABASE_HOST: db
      CI_PLATFORM_DATABASE_USERNAME: ci_platform
      CI_PLATFORM_DATABASE_PASSWORD: ${CI_PLATFORM_DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CI_EXECUTOR: docker
      CI_EXECUTOR_IMAGE: ${CI_EXECUTOR_IMAGE:-ruby:3.4.8-slim}
      CI_ARCHIVE_MAX_BYTES: ${CI_ARCHIVE_MAX_BYTES:-52428800}
      CI_ARCHIVE_MAX_EXTRACTED_BYTES: ${CI_ARCHIVE_MAX_EXTRACTED_BYTES:-209715200}
      CI_ARCHIVE_MAX_ENTRIES: ${CI_ARCHIVE_MAX_ENTRIES:-20000}
      CI_EXECUTOR_WORKSPACE_BYTES: ${CI_EXECUTOR_WORKSPACE_BYTES:-268435456}
      CI_EXECUTOR_TIMEOUT: ${CI_EXECUTOR_TIMEOUT:-300}
      CI_RUN_TIMEOUT: ${CI_RUN_TIMEOUT:-900}
      CI_EXECUTOR_MAX_OUTPUT_BYTES: ${CI_EXECUTOR_MAX_OUTPUT_BYTES:-200000}
      CI_EXECUTOR_MAX_LOG_BYTES_PER_JOB: ${CI_EXECUTOR_MAX_LOG_BYTES_PER_JOB:-1000000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: bundle exec sidekiq

volumes:
  postgres_data:
  redis_data: